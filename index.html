<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macera Fonemde - Giriş</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f051d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgba(30, 15, 50, 0.85);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(120, 50, 200, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(150, 80, 250, 0.2);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #d1b3ff;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #bfa1e6;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4a2875;
            background: #19092d;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #9b51e0;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #7928ca, #b100ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .secondary-btn {
            background: transparent;
            border: 1px solid #7928ca;
            margin-top: 8px;
        }
        .secondary-btn:hover {
            background: rgba(121, 40, 202, 0.1);
        }
        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Macera Fonemde</h2>
        
        <div class="input-group">
            <label>E-posta Adresi</label>
            <input type="email" id="email" placeholder="ornek@mail.com">
        </div>
        <div class="input-group">
            <label>Şifre</label>
            <input type="password" id="password" placeholder="******">
        </div>

        <button id="loginBtn" type="button">Giriş Yap</button>
        <button id="registerBtn" class="secondary-btn" type="button">Kayıt Ol</button>
        
        <p id="message"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnqeiho2_OsIEtFjt5f3xwQJO_7Zvo71Y",
            authDomain: "macerafonemde.firebaseapp.com",
            projectId: "macerafonemde",
            storageBucket: "macerafonemde.firebasestorage.app",
            messagingSenderId: "59091076960",
            appId: "1:59091076960:web:459d45f325fd7d1d788005",
            measurementId: "G-1SED6PGTC7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const registerBtn = document.getElementById("registerBtn");
        const message = document.getElementById("message");

        // Giriş Yap Butonu
        loginBtn.addEventListener("click", async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                message.style.color = "#ff4d4d";
                message.innerText = "Lütfen e-posta ve şifrenizi giriniz.";
                return;
            }

            try {
                message.style.color = "#d1b3ff";
                message.innerText = "Giriş yapılıyor...";

                await signInWithEmailAndPassword(auth, email, password);

                message.style.color = "#00ffcc";
                message.innerText = "Giriş başarılı! Hoş geldiniz.";
            } catch (error) {
                message.style.color = "#ff4d4d";
                message.innerText = "Giriş Hatası: " + error.message;
            }
        });

        // Kayıt Ol Butonu
        registerBtn.addEventListener("click", async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                message.style.color = "#ff4d4d";
                message.innerText = "Kayıt olmak için e-posta ve şifre belirlemelisiniz.";
                return;
            }

            try {
                message.style.color = "#d1b3ff";
                message.innerText = "Kayıt oluşturuluyor...";

                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await sendEmailVerification(userCredential.user);

                message.style.color = "#00ffcc";
                message.innerText = "Kayıt başarılı! E-postanıza doğrulama linki gönderildi.";
            } catch (error) {
                message.style.color = "#ff4d4d";
                message.innerText = "Kayıt Hatası: " + error.message;
            }
        });
    </script>
</body>
</html>
