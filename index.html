<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macera Fonemde - Giriş</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0f051d; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: rgba(30, 15, 50, 0.9); padding: 40px; border-radius: 16px; width: 350px; text-align: center; border: 1px solid #7928ca; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #4a2875; background: #19092d; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: #7928ca; color: white; font-weight: bold; cursor: pointer; }
        .secondary { background: transparent; border: 1px solid #7928ca; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Macera Fonemde</h2>
        <input type="email" id="email" placeholder="E-posta">
        <input type="password" id="password" placeholder="Şifre">
        
        <button id="loginBtn">Giriş Yap</button>
        <button id="registerBtn" class="secondary">Kayıt Ol</button>
        
        <p id="message"></p>
    </div>

    <!-- Firebase SDK'yı biraz daha farklı yükleyelim -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnqeiho2_OsIEtFjt5f3xwQJO_7Zvo71Y",
            authDomain: "macerafonemde.firebaseapp.com",
            projectId: "macerafonemde",
            storageBucket: "macerafonemde.firebasestorage.app",
            messagingSenderId: "59091076960",
            appId: "1:59091076960:web:459d45f325fd7d1d788005"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("loginBtn").onclick = () => {
            console.log("Giriş tıklandı");
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            signInWithEmailAndPassword(auth, email, password)
                .then(() => alert("Giriş başarılı!"))
                .catch(err => alert("Hata: " + err.message));
        };

        document.getElementById("registerBtn").onclick = () => {
            console.log("Kayıt tıklandı");
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => alert("Kayıt başarılı!"))
                .catch(err => alert("Hata: " + err.message));
        };
    </script>
</body>
</html>
