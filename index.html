<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altın Peşinde - Fonem</title>
    <style>
        body { background-color: #1a1a2e; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        .container { width: 90%; max-width: 640px; position: relative; }
        .video-container { position: relative; background: #000; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; }
        .skip-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); color: #d4af37; border: 1px solid #d4af37; padding: 5px 15px; cursor: pointer; z-index: 100; }
        .parchment { display: none; background: #f4ecd8; color: #3b2f2f; padding: 30px; text-align: center; border-radius: 8px; border: 3px solid #8b5a2b; }
        .muhur-img { width: 80px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Video Alanı -->
        <div class="video-container" id="videoContainer">
            <video id="promoVideo" playsinline muted controls>
                <source src="anasayfafonem.mp4" type="video/mp4">
                Tarayıcınız video desteklemiyor.
            </video>
            <button class="skip-btn" onclick="showParchment()">Skip</button>
        </div>

        <!-- Parşömen -->
        <div class="parchment" id="parchmentArea">
            <img src="muhur.png" alt="Mühür" class="muhur-img">
            <h2>Ankara'nın Gizli Hazinesi</h2>
            <p>Macera seni bekliyor!</p>
            <button onclick="alert('Başlıyoruz!')">Maceraya Başla</button>
        </div>
    </div>

    <script>
        const promoVideo = document.getElementById('promoVideo');
        
        // Video yüklenemezse veya hata verirse otomatik parşömeni göster
        promoVideo.addEventListener('error', showParchment);
        promoVideo.addEventListener('ended', showParchment);

        function showParchment() {
            document.getElementById('videoContainer').style.display = 'none';
            document.getElementById('parchmentArea').style.display = 'block';
        }
    </script>
</body>
</html>
