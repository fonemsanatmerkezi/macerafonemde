<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altın Peşinde - Maceraya Başla</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 640px;
        }

        video {
            width: 100%;
            display: block;
        }

        #parchment {
            display: none;
            background-color: #f4ecd8;
            padding: 40px;
            text-align: center;
            border: 2px solid #8b5a2b;
            font-family: serif;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="videoWrapper">
            <video id="promoVideo" autoplay muted playsinline>
                <source src="anasayfafonem.mp4" type="video/mp4">
            </video>
        </div>

        <div id="parchment">
            <h1>Maceraya Başla</h1>
            <p>Ankara'nın gizli hazinesi seni bekliyor.</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('promoVideo');
        const videoWrapper = document.getElementById('videoWrapper');
        const parchment = document.getElementById('parchment');

        video.addEventListener('ended', () => {
            videoWrapper.style.display = 'none';
            parchment.style.display = 'block';
        });
    </script>
</body>
</html>
