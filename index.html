<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altın Peşinde - Fonem Sanat Merkezi</title>
    <style>
        :root {
            --primary-purple: #4b2e83;
            --accent-gold: #d4af37;
            --dark-bg: #1a1a2e;
            --parchment-bg: #f4ecd8;
            --parchment-border: #8b5a2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. Aşama: Video Alanı */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .skip-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .skip-btn:hover {
            background: var(--accent-gold);
            color: #000;
        }

        /* 2. Aşama: Giriş Ekranı */
        .login-screen {
            display: none;
            width: 100%;
            max-width: 400px;
            background: #252542;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid var(--accent-gold);
        }

        .login-screen h2 {
            color: var(--accent-gold);
            margin-bottom: 20px;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1a1a2e;
            border: 1px solid #4b2e83;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-btn:hover {
            background-color: #e5c158;
        }

        /* 3. Aşama: Parşömen Alanı */
        .parchment {
            display: none;
            position: relative;
            width: 100%;
            max-width: 640px;
            background-color: var(--parchment-bg);
            color: #3b2f2f;
            border: 3px solid var(--parchment-border);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
            animation: fadeIn 0.8s ease forwards;
        }

        .muhur-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin: 0 auto 15px auto;
            display: block;
        }

        .parchment h2 {
            color: var(--primary-purple);
            margin-bottom: 15px;
            font-family: 'Georgia', serif;
        }

        .parchment p {
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .action-btn {
            display: block;
            width: 100%;
            max-width: 250px;
            margin: 20px auto 0 auto;
            background-color: var(--primary-purple);
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. VİDEO BÖLÜMÜ -->
        <div class="video-container" id="videoContainer">
            <video id="promoVideo" autoplay muted playsinline>
                <source src="anasayfafonem.mp4" type="video/mp4">
                Tarayıcınız video etiketini desteklemiyor.
            </video>
            <button class="skip-btn" id="skipBtn">Skip &gt;&gt;</button>
        </div>

        <!-- 2. GİRİŞ EKRANI -->
        <div class="login-screen" id="loginScreen">
            <h2>Maceraya Giriş</h2>
            <input type="text" id="usernameInput" class="login-input" placeholder="Adınızı Girin">
            <button class="login-btn" id="loginBtn">Devam Et</button>
        </div>

        <!-- 3. PARŞÖMEN BÖLÜMÜ -->
        <div class="parchment" id="parchmentArea">
            <img src="muhur.png" alt="Mühür" class="muhur-img">
            <h2>Ankara'nın Gizli Hazinesi</h2>
            <p>Maceraya hoş geldin <span id="displayName" style="font-weight: bold; color: var(--primary-purple);"></span>! Altın Peşinde kampanyası resmi olarak başladı.</p>
            <p>Kafemizde sıcak ve soğuk içeceklerin yudumlanırken çözülecek ilk bulmaca seni bekliyor.</p>
            <button class="action-btn" id="startQuestBtn">Maceraya Başla</button>
        </div>
    </div>

    <script>
        const videoContainer = document.getElementById('videoContainer');
        const promoVideo = document.getElementById('promoVideo');
        const skipBtn = document.getElementById('skipBtn');
        const loginScreen = document.getElementById('loginScreen');
        const loginBtn = document.getElementById('loginBtn');
        const usernameInput = document.getElementById('usernameInput');
        const parchmentArea = document.getElementById('parchmentArea');
        const displayName = document.getElementById('displayName');
        const startQuestBtn = document.getElementById('startQuestBtn');

        // Videodan giriş ekranına geçiş fonksiyonu
        function showLogin() {
            videoContainer.classList.add('hidden');
            loginScreen.style.display = 'block';
            try { promoVideo.pause(); } catch(e) {}
        }

        // Skip butonuna tıklandığında veya video bittiğinde giriş ekranına at
        skipBtn.addEventListener('click', showLogin);
        promoVideo.addEventListener('ended', showLogin);

        // Giriş yap butonuna tıklandığında parşömeni göster
        loginBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name === "") {
                alert("Lütfen adınızı girin!");
                return;
            }
            displayName.textContent = name;
            loginScreen.style.display = 'none';
            parchmentArea.style.display = 'block';
        });

        startQuestBtn.addEventListener('click', () => {
            alert("Macera başlıyor!");
        });
    </script>
</body>
</html>
