<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altın Peşinde - Fonem Sanat Merkezi</title>
    <style>
        :root {
            --primary-purple: #4b2e83;
            --accent-gold: #d4af37;
            --dark-bg: #1a1a2e;
            --parchment-bg: #f4ecd8;
            --parchment-border: #8b5a2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .skip-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .skip-btn:hover {
            background: var(--accent-gold);
            color: #000;
        }

        .parchment {
            display: none;
            position: relative;
            width: 100%;
            max-width: 640px;
            background-color: var(--parchment-bg);
            color: #3b2f2f;
            border: 3px solid var(--parchment-border);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 0 40px rgba(139, 90, 43, 0.2);
            animation: fadeIn 0.8s ease forwards;
            text-align: center;
        }

        .muhur-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin: 0 auto 15px auto;
            display: block;
        }

        .parchment h2 {
            color: var(--primary-purple);
            margin-bottom: 15px;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
        }

        .parchment p {
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .action-btn {
            display: block;
            width: 100%;
            max-width: 250px;
            margin: 20px auto 0 auto;
            background-color: var(--primary-purple);
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            text-align: center;
        }

        .action-btn:hover {
            background-color: #361f5e;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="video-container" id="videoContainer">
            <video id="promoVideo" preload="auto" playsinline>
                <source src="anasayfafonem.mp4" type="video/mp4">
                Tarayıcınız video etiketini desteklemiyor.
            </video>
            <button class="skip-btn" id="skipBtn">Skip &gt;&gt;</button>
        </div>

        <div class="parchment" id="parchmentArea">
            <img src="muhur.png" alt="Mühür" class="muhur-img">
            <h2>Ankara'nın Gizli Hazinesi</h2>
            <p>Maceraya hoş geldin gezgin! Altın Peşinde kampanyası resmi olarak başladı. İlk ipucunu çözmek için hazır mısın?</p>
            <p>Kafemizde sıcak ve soğuk içeceklerin yudumlanırken çözülecek ilk bulmaca seni bekliyor.</p>
            <button class="action-btn" id="startQuestBtn">Maceraya Başla</button>
        </div>
    </div>

    <script>
        const videoContainer = document.getElementById('videoContainer');
        const promoVideo = document.getElementById('promoVideo');
        const skipBtn = document.getElementById('skipBtn');
        const parchmentArea = document.getElementById('parchmentArea');
        const startQuestBtn = document.getElementById('startQuestBtn');

        window.addEventListener('DOMContentLoaded', () => {
            promoVideo.play().catch(error => {
                promoVideo.muted = true;
                promoVideo.play().catch(e => console.log("Otomatik oynatma kısıtlandı:", e));
            });
        });

        function showParchment() {
            videoContainer.classList.add('hidden');
            parchmentArea.style.display = 'block';
            promoVideo.pause();
        }

        skipBtn.addEventListener('click', showParchment);
        promoVideo.addEventListener('ended', showParchment);

        startQuestBtn.addEventListener('click', () => {
            alert("Macera başlıyor! İpuçları yükleniyor...");
        });
    </script>
</body>
</html>
