<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altın Peşinde - Fonem</title>
    <style>
        body { background-color: #1a1a2e; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; font-family: sans-serif; }
        .container { width: 90%; max-width: 640px; position: relative; }
        .video-container { position: relative; background: #000; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .skip-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #d4af37; border: 1px solid #d4af37; padding: 5px 15px; cursor: pointer; z-index: 100; border-radius: 4px; }
        .skip-btn:hover { background: rgba(212, 175, 55, 0.2); }
        .parchment { display: none; background: #f4ecd8; color: #3b2f2f; padding: 30px; text-align: center; border-radius: 8px; border: 3px solid #8b5a2b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .muhur-img { width: 80px; margin-bottom: 15px; }
        .action-btn { background: #8b5a2b; color: #f4ecd8; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .action-btn:hover { background: #6b4420; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Video Alanı -->
        <div class="video-container" id="videoContainer">
            <video id="promoVideo" playsinline muted autoplay>
                <source src="anasayfafonem.mp4" type="video/mp4">
                Tarayıcınız video desteklemiyor.
            </video>
            <button class="skip-btn" onclick="showParchment()">Geç</button>
        </div>

        <!-- Parşömen / İçerik Alanı -->
        <div class="parchment" id="parchmentArea">
            <img src="muhur.png" alt="Mühür" class="muhur-img">
            <h2>Ankara'nın Gizli Hazinesi</h2>
            <p>Macera seni bekliyor!</p>
            
            <!-- Buraya kullanıcı adı / kayıt ol alanlarını ekleyebilirsiniz -->
            <div id="authArea">
                <button class="action-btn" onclick="alert('Başlıyoruz!')">Maceraya Başla</button>
            </div>
        </div>
    </div>

    <script>
        const promoVideo = document.getElementById('promoVideo');
        const videoContainer = document.getElementById('videoContainer');
        const parchmentArea = document.getElementById('parchmentArea');
        
        // Video bittiğinde veya hata aldığında parşömeni göster
        promoVideo.addEventListener('ended', showParchment);
        promoVideo.addEventListener('error', showParchment);

        function showParchment() {
            // Videoyu durdur ve kaynakları serbest bırak
            promoVideo.pause();
            
            // Görünürlük geçişleri
            videoContainer.style.display = 'none';
            parchmentArea.style.display = 'block';
        }
    </script>
</body>
</html>
