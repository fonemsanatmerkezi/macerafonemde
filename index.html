<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altın Peşinde - Macera Fonemde</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #0f051d; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden;
        }

        /* REKLAM VİDEOSU EKRANI (ORİJİNAL AKIŞ) */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f051d;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
            cursor: pointer;
        }

        #intro-screen video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ANA GİRİŞ / KAYIT FORMU KUTUSU */
        .container { 
            background: rgba(30, 15, 50, 0.9); 
            padding: 30px; 
            border-radius: 16px; 
            width: 100%;
            max-width: 380px;
            text-align: center; 
            border: 1px solid #7928ca; 
            box-shadow: 0 8px 32px rgba(120, 50, 200, 0.3);
            box-sizing: border-box; 
            margin: 20px;
            z-index: 1;
        }

        .form-logo {
            width: 180px;
            margin-bottom: 15px;
        }

        h2 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #bfa1e6;
        }
        input { 
            width: 100%; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #4a2875; 
            background: #19092d; 
            color: white; 
            box-sizing: border-box; 
            outline: none; 
        }
        input:focus { 
            border-color: #ffd700; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px; 
            border: none; 
            border-radius: 8px; 
            background: linear-gradient(135deg, #7928ca, #b100ff); 
            color: white; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        button:hover { 
            opacity: 0.9; 
        }
        .secondary { 
            background: transparent; 
            border: 1px solid #7928ca; 
        }
        .secondary:hover { 
            background: rgba(121, 40, 202, 0.1); 
        }

        .divider {
            margin: 12px 0;
            font-size: 12px;
            color: #8c73b0;
        }

        .text-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 13px;
            margin-top: 8px;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            width: auto;
        }
        .text-btn:hover {
            color: #ffaa00;
            opacity: 1;
        }

        /* PARŞÖMEN SÖZLEŞME EKRANI (DÜZELTİLMİŞ ÖLÇÜLER) */
        #contract-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 3, 20, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 15px;
            box-sizing: border-box;
        }

        .scroll-wrapper {
            position: relative;
            width: 100%;
            max-width: 580px;
            height: 85vh;
            max-height: 720px;
            background-image: url('parsoemen.jpg'); 
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Yazıların silindirlerin arasına tam oturması için boşluklar */
            padding: 16% 15% 12% 15%; 
            box-sizing: border-box;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            animation: unfoldScroll 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes unfoldScroll {
            0% { transform: scaleY(0.05) scaleX(0.2); opacity: 0; }
            50% { transform: scaleY(1.05) scaleX(1); opacity: 1; }
            100% { transform: scaleY(1) scaleX(1); opacity: 1; }
        }

        .scroll-title {
            font-family: 'Cinzel', serif;
            font-size: 19px;
            font-weight: 700;
            color: #2c1810;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

            flex-grow: 1;
            overflow-y: auto;
